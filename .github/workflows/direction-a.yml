name: Direction A font checks
on:
  push:
    paths:
      - 'sources/**'
      - 'qa/**'
      - 'fonts/**'
      - 'build.py'
      - 'prepare_submission.py'
      - 'requirements.txt'
      - 'Makefile'
      - 'OFL.txt'
      - '.github/workflows/direction-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: make build qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direction-a-review
          path: |
            qa/*.json
            qa/*.md
            fonts/
